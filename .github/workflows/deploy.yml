name: Build Ambikly Documentation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Build-only: this repository is private, so GitHub Pages is not used.
# Netlify publishes the site (see netlify.toml). This job just fails the
# build on a broken link or a bad page before it reaches Netlify.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Builds with ignoreDeadLinks:false — a broken cross-reference fails
      # the build instead of shipping a 404 into the docs.
      - name: Build documentation
        run: npm run build
